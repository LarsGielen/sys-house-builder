# Keyboard shortcuts. Each action maps to one or more shortcuts.
# Modifiers: ctrl, shift, alt. A shortcut can be bound to only one action.
[bindings]
"editor.undo" = ["ctrl+z"]
"editor.redo" = ["ctrl+shift+z", "ctrl+y"]
"editor.save" = ["ctrl+s"]
"editor.open" = ["ctrl+o"]

# Held controls. Modifiers only choose the control when it starts, so releasing one mid-drag keeps it going.
"camera.orbit" = ["mouse_right"]
"camera.pan" = ["shift+mouse_right"]

# Mouse axes. Motion drives looking and scroll drives zooming. Modifiers work as for shortcuts and
# must match exactly, so "scroll" stops while Shift is held and "shift+scroll" can take over.
"camera.look" = ["mouse_motion"]
"camera.zoom" = ["scroll"]
