# Keyboard and mouse bindings. Each context has a section; each action maps to one or more inputs.
# Modifiers: ctrl, shift, alt. Within a context an input, with its modifiers, can be bound once.
# A context that is higher in the stack takes an input it binds from the contexts below it.

# Active whenever the editor is open.
[contexts.global.bindings]
"editor.undo" = ["ctrl+z"]
"editor.redo" = ["ctrl+shift+z", "ctrl+y"]
"editor.save" = ["ctrl+s"]
"editor.open" = ["ctrl+o"]
"editor.toggle_snap" = ["g"]

# Active while the cursor is over the viewport.
[contexts.viewport.bindings]
"camera.orbit" = ["mouse_right"]
"camera.pan" = ["shift+mouse_right"]

"camera.look" = ["mouse_motion", "shift+mouse_motion"]
"camera.zoom" = ["scroll"]
"camera.move" = [
	{ composite = "2d", up = "w", down = "s", left = "a", right = "d" },
	{ composite = "2d", up = "up", down = "down", left = "left", right = "right" },
]
