[workspace]
resolver = "3"
members = ["crates/house_builder", "crates/house_editor", "crates/wall_graph", "crates/wall_mesh"]

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
